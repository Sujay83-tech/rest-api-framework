# =============================================================
# config.properties
# Central config for all test environments
# Change BASE_URL here → reflects across all tests instantly
# =============================================================

# ── Environment ──────────────────────────────────────────────
ENV=dev

# ── Base URLs ────────────────────────────────────────────────
BASE_URL=https://firststudyproject.onrender.com
SWAGGER_URL=https://firststudyproject.onrender.com/swagger-ui/index.html
API_DOCS_URL=https://firststudyproject.onrender.com/v3/api-docs

# ── Request Defaults ─────────────────────────────────────────
# Timeout in milliseconds
CONNECTION_TIMEOUT=10000
READ_TIMEOUT=30000

# ── Report Settings ──────────────────────────────────────────
REPORT_TITLE=REST API Test Report — First Study Project
REPORT_NAME=API Automation Suite
REPORT_PATH=test-output/ExtentReport.html
