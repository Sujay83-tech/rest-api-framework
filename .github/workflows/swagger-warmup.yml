name: 🌅 Morning API Warm-Up & Endpoint Audit — 8:30 AM IST

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for manual trigger (optional)'
        required: false
        default: 'Manual run by QA'

jobs:

  qa-morning-warmup:
    name: 🔍 Wake Up + Validate All APIs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: 🔔 Step 1 — Wake Up Render Service
        run: |
          TARGET="https://firststudyproject.onrender.com/swagger-ui/index.html"
          MAX=6
          WAIT=30

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🎯 Target : $TARGET"
          echo "  🕗 IST    : $(TZ='Asia/Kolkata' date '+%A, %d %b %Y — %I:%M %p')"
          echo "  🌍 UTC    : $(date -u '+%H:%M UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          for i in $(seq 1 $MAX); do
            echo ""
            echo "  🔁 Attempt $i of $MAX..."

            # ✅ FIX: '|| echo "000"' means if curl times out (exit 28),
            # assign "000" to STATUS instead of crashing the whole script.
            # This lets the retry loop continue normally.
            STATUS=$(curl --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 70 \
              --connect-timeout 10 \
              "$TARGET" || echo "000")

            echo "  📡 HTTP: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "  ✅ Render is AWAKE!"
              exit 0
            fi

            [ "$i" -eq "$MAX" ] && echo "  ❌ Failed after $MAX attempts." && exit 1
            echo "  💤 Waiting ${WAIT}s before next attempt..."
            sleep $WAIT
          done

      - name: 📋 Step 2 — Fetch OpenAPI Spec & List All Endpoints
        run: |
          SPEC_URL="https://firststudyproject.onrender.com/v3/api-docs"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📄 Fetching live spec: $SPEC_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ✅ FIX: same pattern — timeout returns "000" not a crash
          HTTP_STATUS=$(curl --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 \
            --connect-timeout 10 \
            "$SPEC_URL" || echo "000")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "  ❌ /v3/api-docs returned HTTP $HTTP_STATUS"
            echo "  ⚠️  Dev team action needed: configure springdoc-openapi."
            exit 1
          fi

          # ✅ FIX: empty string fallback if spec fetch fails
          SPEC=$(curl --silent --max-time 30 "$SPEC_URL" || echo "")

          echo "$SPEC" | python3 -c "
          import json, sys

          spec = json.load(sys.stdin)
          info  = spec.get('info', {})
          paths = spec.get('paths', {})
          tags  = spec.get('tags', [])

          print()
          print(f'  📦 Title      : {info.get(\"title\",   \"Not set\")}')
          print(f'  🔢 Version    : {info.get(\"version\", \"Not set\")}')
          print(f'  🏷️  Tag Groups : {len(tags)}')
          print(f'  🔗 Total Endpoints: {len(paths)}')
          print()

          if not paths:
              print('  ⚠️  WARNING: Zero endpoints found.')
              sys.exit(1)

          get_l, post_l, put_l, patch_l, del_l, other = [], [], [], [], [], []
          for path, methods in paths.items():
              for method in methods.keys():
                  m = method.upper()
                  if m == 'GET':      get_l.append(path)
                  elif m == 'POST':   post_l.append(path)
                  elif m == 'PUT':    put_l.append(path)
                  elif m == 'PATCH':  patch_l.append(path)
                  elif m == 'DELETE': del_l.append(path)
                  else:               other.append(f'[{m}] {path}')

          def print_group(label, emoji, items):
              if items:
                  print(f'  {emoji} {label} ({len(items)})')
                  for item in items:
                      print(f'       ↳ {item}')
                  print()

          print('  ── Endpoints by Method ──────────────────────────')
          print_group('GET',    '🟢', get_l)
          print_group('POST',   '🔵', post_l)
          print_group('PUT',    '🟡', put_l)
          print_group('PATCH',  '🟠', patch_l)
          print_group('DELETE', '🔴', del_l)
          print_group('OTHER',  '⚪', other)
          print(f'  ✅ All {len(paths)} endpoint(s) loaded and verified.')
          "

      - name: ✅ Step 3 — QA Audit Complete
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🎯 Warm-up & audit complete!"
          echo "  🌐 Swagger UI : https://firststudyproject.onrender.com/swagger-ui/index.html"
          echo "  📋 API Spec   : https://firststudyproject.onrender.com/v3/api-docs"
          echo "  📅 Next run   : Tomorrow at 8:30 AM IST"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
